# Upstream local Redis keeps data only in memory: a node/WSL restart wipes every
# registered adapter. Give it a volume (the cluster's default storage class: local-path on k3s,
# standard on Docker Desktop) and append-only persistence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: adapter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
