# Local edge for the shared ngrok domain (scripts/tunnel.sh runs it in Docker as "mcpdemo-edge").
# ngrok sends everything under /mcp here (path routing only; rewrites need a paid ngrok plan), and this strips the
# prefixes: the MCP Gateway and the chatbot dev server keep serving their usual paths.
#   /mcp/gw/...                                     -> MCP Gateway port-forward   (host :8000, prefix stripped)
#   /.well-known/oauth-protected-resource/mcp/gw... -> its protected-resource metadata (RFC 9728 location)
#   /mcp/...                                        -> chatbot dev server         (host :3000, served under /mcp/)
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# The gateway builds its OAuth discovery URLs (RFC 9728) from the request it sees, which has no /mcp/gw prefix.
# Put the prefix back: in the 401's WWW-Authenticate resource_metadata, and in the metadata document's "resource".
map $upstream_http_www_authenticate $www_authenticate {
  "~^(?<pre>.*resource_metadata=\")[^\"]*/\.well-known/oauth-protected-resource(?<rest>[^\"]*)(?<post>\".*)$"
    "${pre}https://$host/.well-known/oauth-protected-resource/mcp/gw${rest}${post}";
  default $upstream_http_www_authenticate;
}

server {
  listen 8090;
  absolute_redirect off;
  client_max_body_size 10m;
  proxy_http_version 1.1;
  proxy_buffering off;            # MCP streamable HTTP and the agent's event stream
  proxy_read_timeout 1h;

  location = /mcp { return 301 /mcp/; }

  # MCP Gateway. (A location with any proxy_set_header drops the server-level ones, so each sets all it needs.)
  location /mcp/gw {
    rewrite ^/mcp/gw/?(.*)$ /$1 break;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_hide_header WWW-Authenticate;
    add_header WWW-Authenticate $www_authenticate always;
    proxy_pass http://host.docker.internal:8000;
  }
  location /.well-known/oauth-protected-resource/mcp/gw {
    rewrite ^/\.well-known/oauth-protected-resource/mcp/gw(.*)$ /.well-known/oauth-protected-resource$1 break;
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter_once on;
    sub_filter "\"resource\":\"https://$host/adapters" "\"resource\":\"https://$host/mcp/gw/adapters";
    sub_filter "\"resource\":\"http://$host/adapters" "\"resource\":\"https://$host/mcp/gw/adapters";
    proxy_pass http://host.docker.internal:8000;
  }

  # Chatbot dev server (Angular, baseHref /mcp/).
  location /mcp/ {
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;          # live reload (websocket)
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://host.docker.internal:3000;
  }

  # ISC Onboarding Agent (onboarding/, spec 001): web + API in one container on the cluster, port-forwarded to :8091 by
  # onboarding/deploy/scripts/up.sh. Prefix kept (the app is built with baseHref /onboarding/); SSE unbuffered.
  location = /onboarding { return 301 /onboarding/; }
  location /onboarding/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 1h;
    client_max_body_size 11m;
    proxy_pass http://host.docker.internal:8091;
  }

  location / { return 404; }
}
