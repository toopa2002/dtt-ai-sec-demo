[project]
name = "onboarding-agent"
version = "0.1.0"
description = "AgentCore runtime for the ISC Onboarding Agent: Claude Haiku tool loop over generic SailPoint ISC tools"
requires-python = ">=3.12"
dependencies = [
  "bedrock-agentcore>=0.1",
  "anthropic[bedrock]>=0.40",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "boto3>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "fastapi>=0.142.4",
]
evals = ["pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
