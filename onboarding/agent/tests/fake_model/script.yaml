# Scripted model replies for the local dev stack and the e2e/smoke runs (Constitution IV, research R28).
# The first rule whose `when` matches decides one round of a turn. Conditions:
#   role: iam_engineer | application_owner      text: regex on the writer's message
#   round / min_round: model call number within the turn (0 = first)
#   last / not_last: regex on the latest tool results     has_source: true | false
#   tool_offered / tool_not_offered: a tool name the turn may use
# `then`: blocks for that round, {text: ...} or {tool: name, input: {...}}; a tool the turn may not use is dropped.
# Placeholders: {error} {role_name} {left} {first_steps}. A round with no blocks ends the turn.
# `delay: seconds` holds the round before it answers (for tests that need a busy agent).
rules:

  # ---------------------------------------------------------------- tests: a slow answer keeps the agent busy
  - when: {round: 0, text: '^slow question'}
    delay: 4
    then:
      - text: "Here is the slow answer."

  # ================================================================ Microsoft Entra ID (spec 002, T029)
  # Scoped with `connector`, and listed first so the AWS rules below never see an Entra session.
  - when: {connector: Microsoft Entra ID, min_round: 1, last: 'AADSTS7000215'}
    then:
      - text: |
          **Side: Entra.** The connection check failed with `AADSTS7000215`: SailPoint got an invalid client secret
          (usually the secret's ID instead of its Value). I've asked the Entra administrator for a new secret through
          the secret field.
      - tool: request_new_secret
        input: {reason: "SailPoint rejected the secret (AADSTS7000215): the ID may have been used instead of the Value"}
      - tool: note_diagnosis
        input: {text: "Cause on the Entra side: invalid client secret (AADSTS7000215). A new secret goes through the secret field."}

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"running": true'}
    then:
      - text: >-
          Account aggregation is still running in SailPoint. The session follows it and posts the result here when it
          ends, even if nobody is watching.

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"tenant_limitation": true'}
    then:
      - text: |
          This SailPoint tenant doesn't let automation start Foundry dataset aggregation.
          That's a **tenant limitation**, not a setup problem, and the onboarding hasn't failed. Please start it in ISC:
          {ui_path}. Then tell me "done" and I'll check the AI-agent count and turn on the schedule.
      - tool: set_waiting
        input: {"on": iam_engineer, reason: "start the Foundry aggregation in ISC, then say \"done\""}

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"ok": false'}
    then:
      - text: "**The check failed:** `{error}`."

  - when: {connector: Microsoft Entra ID, role: iam_engineer, round: 0, text: 'extend'}
    then:
      - text: "Looking for the existing Entra source for this tenant."
      - {tool: find_connector_sources}

  - when: {connector: Microsoft Entra ID, role: iam_engineer, min_round: 1, last: '"sources": \[\{'}
    then:
      - tool: adopt_source
        input: {source_id: "{source_id}"}

  - when: {connector: Microsoft Entra ID, role: iam_engineer, min_round: 1, last: '"adopted": true'}
    then:
      - {tool: configure_source}
      - {tool: ensure_schema_attributes}
      - {tool: peek_accounts}

  - when: {connector: Microsoft Entra ID, role: iam_engineer, round: 0, has_source: false, text: 'create|connector|run the checks'}
    then:
      - text: "Creating the Entra source and running the checks now."
      - {tool: create_source}
      - {tool: configure_source}
      - {tool: ensure_schema_attributes}
      - {tool: peek_accounts}

  - when: {connector: Microsoft Entra ID, role: iam_engineer, round: 0, has_source: true, text: 'rerun|run the|again|check'}
    then:
      - text: "Rerunning the checks now."
      - {tool: peek_accounts}

  - when: {connector: Microsoft Entra ID, round: 0, text: 'continuing with the next step'}
    then:
      - {tool: aggregate_datasets}
      - {tool: set_dataset_schedule}
      - {tool: set_provisioning_policy}
      - {tool: set_correlation}

  - when: {connector: Microsoft Entra ID, role: iam_engineer, round: 0, text: '^done|started it in isc'}
    then:
      - {tool: count_ai_agents}
      - {tool: set_dataset_schedule}

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"accounts_read"'}
    then:
      - {tool: test_connection}
      - {tool: start_aggregation}

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"entitlements": \{'}
    then:
      - {tool: aggregate_datasets}
      - {tool: set_dataset_schedule}
      - {tool: set_provisioning_policy}
      - {tool: set_correlation}

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"ai_agents"|"schedule"|"skipped"|"kept_existing"|"rules"'}
    then:
      - text: >-
          All checks passed: connection check, Test Connection, entitlement and account aggregation, and each chosen
          capability's check. The counts are in "What SailPoint now sees".
      - tool: notify_other_thread
        input: {relay_note: "All SailPoint checks passed; the Entra source is live."}
      - tool: set_waiting
        input: {"on": null}

  - when: {connector: Microsoft Entra ID, role: application_owner, round: 0, text: '\[masked\]'}
    then:
      - text: >-
          I didn't receive it, and nobody can see it. Because it went into the chat, please delete that secret in
          Entra (Certificates & secrets), create a new one and put its Value in the secret field.
      - tool: request_new_secret
        input: {reason: "a secret was pasted into the chat and counts as exposed"}

  - when: {connector: Microsoft Entra ID, role: application_owner, round: 0, text: 'secret in the field|new secret'}
    then:
      - text: "Thanks: the secret field shows it as received. Nothing else to do for it."

  - when: {connector: Microsoft Entra ID, role: application_owner, round: 0, text: 'appId|"servicePrincipal"'}
    then:
      - text: "Thanks: the app is registered. I've noted its Application (client) ID. Next: add the permissions."
      - tool: record_application_id
        input: {client_id: "3f6a1c8e-52d4-4b0f-9a7e-c1d28e4b6a05"}

  - when: {connector: Microsoft Entra ID, round: 0, text: 'apply the new secret'}
    then:
      - {tool: apply_application_secret}

  - when: {connector: Microsoft Entra ID, role: application_owner, round: 0, text: 'new secret received'}
    then:
      - {tool: apply_application_secret}

  - when: {connector: Microsoft Entra ID, min_round: 1, last: '"applied": true'}
    then:
      - {tool: peek_accounts}

  # ---------------------------------------------------------------- after any SailPoint check failed (trust)
  - when: {min_round: 1, last: '"ok": false.*(AssumeRole|not authorized|trust)'}
    then:
      - text: |
          **Side: AWS.** The connection check failed: `{error}`. SailPoint could not assume the role
          `{role_name}` because its trust does not accept this tenant. Nothing to change in SailPoint; I've asked the
          AWS owner to check the role trust.
      - tool: post_to_other_thread
        input:
          text: |
            The connection check failed: SailPoint could not assume the role. Please run this **read-only** check of
            the role trust and paste the output:

            ```bash
            aws iam get-role --role-name {role_name} --query Role.AssumeRolePolicyDocument
            ```
          relay_note: Asked the AWS owner to run the read-only get-role check on the role trust.
      - tool: set_waiting
        input: {"on": application_owner, reason: run the get-role check and paste the output}
      - tool: note_diagnosis
        input: {text: "Cause on the AWS side: the role's trust does not let SailPoint assume it. Nothing to change in SailPoint."}
      - tool: update_plan
        input:
          ops:
            - {op: add, after: connection_check, title: "Fix the role's trust", actor: application_owner, kind: change,
               milestone: application_ready, state: in_progress, reason: "SailPoint could not assume the role."}
            - {op: set_state, step_id: aggregation, state: blocked, reason: Waits on the trust fix.}
            - {op: set_state, step_id: test_connection, state: blocked, reason: Waits on the trust fix.}
      - tool: suggest_replies
        input:
          thread: iam_engineer
          items:
            - {text: "Why did the connection check fail?", kind: question}
            - {text: Rerun the connection check, kind: order}
            - {text: "What is left to do?", kind: question}

  - when: {min_round: 1, last: '"ok": false'}
    then:
      - text: "**Side: SailPoint.** The check failed: `{error}`."

  # ---------------------------------------------------------------- IAM engineer orders
  - when: {role: iam_engineer, round: 0, has_source: false, text: 'create|connector|run the checks'}
    then:
      - text: "Creating the source and running the checks now."
      - {tool: create_source}
      - {tool: configure_source}
      - {tool: peek_accounts}

  - when: {role: iam_engineer, round: 0, has_source: true, text: 'rerun|run the|again|fixed|check'}
    then:
      - text: "Rerunning the checks now."
      - {tool: peek_accounts}

  - when: {role: iam_engineer, min_round: 1, last: '"accounts_read"'}
    then:
      - {tool: start_aggregation}
      - {tool: test_connection}

  - when: {role: iam_engineer, min_round: 1, last: '"task_ids".*"ok": true|"ok": true.*"task_ids"'}
    then:
      - text: "All checks passed: connection check, aggregation and Test Connection succeeded."
      - tool: notify_other_thread
        input: {relay_note: "All SailPoint checks passed; the source is live."}
      - tool: set_waiting
        input: {"on": null}

  # ---------------------------------------------------------------- application owner
  - when: {role: application_owner, round: 0, text: 'what do i need|what .*set ?up|first step'}
    then:
      - text: |
          Here are your first steps in AWS. Run them in the management account and paste the output back.

          {first_steps}
      - tool: update_plan
        input:
          ops:
            - {op: set_state, step_id: check_org, state: in_progress}
      - tool: suggest_replies
        input:
          thread: application_owner
          items:
            - {text: "Here is the output:", kind: answer}
            - {text: I get an error at this step, kind: answer}
            - {text: Explain what this step does, kind: question}

  - when: {role: application_owner, round: 0, text: 'tell the iam engineer'}
    then:
      - text: "Done, I passed your message on to the IAM engineer."
      - tool: post_to_other_thread
        input:
          text: "Message from the AWS owner: they are on a call for the next 10 minutes."
          relay_note: Passed your message on to the IAM engineer.
          relayed_from: application_owner

  - when: {role: application_owner, round: 0, text: 'finished|role is ready|fixed|applied|done', tool_offered: peek_accounts}
    then:
      - text: "Thanks. Rerunning the SailPoint checks now."
      - {tool: peek_accounts}
      - {tool: start_aggregation}
      - {tool: test_connection}

  - when: {role: application_owner, min_round: 1, last: '"task_ids"', not_last: '"ok": false'}
    then:
      - text: "They passed: connection check, aggregation and Test Connection all succeeded."
      - tool: post_to_other_thread
        input:
          text: "All checks passed after the AWS owner's fix: connection check, aggregation and Test Connection succeeded."
          relay_note: Reported the check results in the IAM engineer's thread.
      - tool: set_waiting
        input: {"on": null}

  - when: {role: application_owner, round: 0, text: 'connector|sailpoint'}
    then:
      - text: >-
          SailPoint changes are ordered by the IAM engineer, and they can do so at any time. I never need your AWS
          keys: if that key was real, please rotate it.

  - when: {role: application_owner, round: 0, text: 'output|here is'}
    then:
      - text: "Thanks, that matches what I expect. Carry on with the next step."

  # ---------------------------------------------------------------- both
  - when: {round: 0, text: 'what is left'}
    then:
      - text: "Still to do: {left}."

  # Anything else: a short fixed reply in round 0; later rounds end the turn.
  - when: {round: 0}
    then:
      - text: "Thanks, noted. Ask me what is left to do at any time."
