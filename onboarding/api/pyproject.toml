[project]
name = "onboarding-api"
version = "0.1.0"
description = "Session API for the ISC Onboarding Agent: accounts, sessions, shared queue, masking, live events, audit"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pymongo>=4.10",
  "argon2-cffi>=23.1",
  "boto3>=1.40",
  "sse-starlette>=2.1",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
